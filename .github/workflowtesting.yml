name: Go Tests and Checks

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.3

      - name: Initialize Go Module
        run: go mod tidy

      - name: Check Formatting (go fmt)
        run: |
          diff -u <(echo -n) <(gofmt -d .)
          
      - name: Run Vetting (go vet)
        run: go vet ./...

      - name: Run Unit Tests and Generate Coverage
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Display Test Coverage Summary
        run: go tool cover -func=coverage.out | tail -n 1
